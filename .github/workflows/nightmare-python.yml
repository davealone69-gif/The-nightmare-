name: NIGHTMARE Python tests

on:
  push:
    branches:
      - fix/nightmare-contract-v0.3
  pull_request:
    branches:
      - main
      - feature/android-native-conversion

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
