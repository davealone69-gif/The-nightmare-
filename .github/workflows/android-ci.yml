name: Android CI

on:
  push:
    branches:
      - feature/android-native-conversion
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightmare-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android JVM tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android JVM unit tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists and report metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: the-nightmare-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-nightmare-android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
